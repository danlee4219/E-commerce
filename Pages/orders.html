<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link rel="icon" type="image/png" href="../images/Favicon.png">

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .order {
            background: #fff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .order h4 {
            margin-bottom: 5px;
        }

        .date {
            font-size: 13px;
            color: gray;
            margin-bottom: 10px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>My Orders</h2>
        <div id="ordersContainer"></div>
    </div>

    <script src="../JS/orders.js"></script>

</body>

</html>
